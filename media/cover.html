<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>ATHAR — From healthcare challenges to meaningful impact</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #153b2b; background: #F6F5F0; position: relative; }
  .wash { position: absolute; inset: 0 0 0 55%; background: radial-gradient(ellipse at 88% 40%, rgba(0,107,53,.19) 0%, rgba(0,107,53,.08) 42%, transparent 74%); }
  .orb { position: absolute; width: 540px; height: 540px; right: -205px; top: -250px; border-radius: 50%; background: rgba(0,107,53,.055); }
  .layout { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 1fr 475px; gap: 38px; align-items: center; padding: 48px 68px 62px 56px; }
  .brand { display: flex; align-items: center; gap: 30px; transform: translateY(-4px); }
  .logo { width: 190px; height: 220px; object-fit: contain; }
  .copy { padding-top: 8px; }
  .name { font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: 9px; color: #006B35; margin: 0 0 10px; }
  .arabic { display: inline-block; font-family: "Segoe UI", Tahoma, Arial, sans-serif; font-size: 40px; font-weight: 700; color: #C9A04C; direction: rtl; unicode-bidi: isolate; line-height: 1.25; }
  .subtitle { font-size: 23px; line-height: 1.45; color: #344b3e; font-weight: 500; margin: 25px 0 0; max-width: 460px; }
  .card { width: 475px; height: 400px; border-radius: 24px; overflow: hidden; background: white; box-shadow: 0 18px 50px rgba(23,55,37,.16); border: 1px solid rgba(0,107,53,.10); transform: rotate(1.2deg); }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: left top; opacity: .82; }
  .bottom { position: absolute; left: 66px; right: 68px; bottom: 31px; display: flex; align-items: center; gap: 15px; color: #A77D2E; font-size: 16px; font-weight: 600; letter-spacing: .45px; }
  .rule { width: 48px; height: 2px; background: #C9A04C; border-radius: 2px; }
</style>
</head>
<body>
<div class="wash"></div><div class="orb"></div>
<main class="layout">
  <section class="brand">
    <img class="logo" src="logo.svg" alt="ATHAR logo">
    <div class="copy">
      <h1 class="name">ATHAR</h1>
      <div class="arabic" lang="ar" dir="rtl">أثر</div>
      <p class="subtitle">Wearable IoT system for pressure-ulcer prevention</p>
    </div>
  </section>
  <div class="card"><img src="screenshots/dashboard_live_moving.png" alt="Live bilingual ATHAR dashboard"></div>
</main>
<div class="bottom"><span class="rule"></span><span>From healthcare challenges to meaningful impact</span></div>
</body>
</html>
